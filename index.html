<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Storyforge</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="bg-canvas"></div>
  <div id="glitch-overlay"></div>

  <div id="app">
    <header>
      <h1>⚔ STORYFORGE</h1>
      <p>AI-Powered Interactive Storytelling</p>
    </header>

    <!-- ── INTRO SCREEN — book animation renders here ── -->
    <section id="intro-screen"></section>

    <!-- ── STORY SCREEN ── -->
    <section id="story-screen">

      <!-- Chapter sidebar -->
      <div id="chapter-sidebar" style="display:none"></div>

      <!-- Scene background -->
      <div id="scene-bg" class="scene-bg"></div>
      <div class="scene-bg-overlay"></div>

      <!-- Top bar -->
      <div class="story-topbar">
        <div class="story-title-wrap">
          <span class="story-title-label">✦</span>
          <span id="story-title" class="story-title-text"></span>
        </div>
        <div class="topbar-actions">
          <button id="history-btn" class="btn-icon" onclick="toggleHistory()">📜 History</button>
          <button class="btn-icon danger" onclick="resetStory()">✕ New</button>
        </div>
      </div>

      <!-- History panel -->
      <div id="history-panel" class="history-panel">
        <div class="history-panel-header">
          <span>📖 Story So Far</span>
          <button class="close-history" onclick="toggleHistory()">✕</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>

      <!-- Main layout -->
      <div class="story-layout">
        <div id="portrait-rail" class="portrait-rail"></div>
        <div class="scene-center">
          <div class="scene-card">
            <div id="emotion-badge" class="emotion-badge" style="display:none"></div>
            <p id="scene-text" class="scene-text"></p>
          </div>
          <div id="choices-area" class="choices-grid"></div>
        </div>
      </div>

      <!-- Agency input bar injected here by agency.js -->

    </section>
  </div>

  <script src="config.js"></script>
  <script src="story.js"></script>
  <script src="visuals.js"></script>
  <script src="chapters.js"></script>
  <script src="agency.js"></script>
  <script src="intro.js"></script>
  <script src="interactive.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
<script src="pixi-visuals.js"></script>
  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
