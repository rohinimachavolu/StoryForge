<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f0d080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde8c8"/>
      <stop offset="100%" stop-color="#e8c49a"/>
    </radialGradient>
    <radialGradient id="wingL" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c9e8ff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#9ab8e8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7090c0" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="wingR" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#c9e8ff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#9ab8e8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7090c0" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="wingBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="60" cy="70" rx="48" ry="60" fill="url(#glow)"/>

  <!-- Left wing upper -->
  <path d="M60 72 Q28 45 18 22 Q35 38 55 65Z"
        fill="url(#wingL)" stroke="#a0c8f0" stroke-width="0.6" opacity="0.85"/>
  <!-- Left wing lower -->
  <path d="M60 78 Q30 80 22 98 Q40 88 58 76Z"
        fill="url(#wingL)" stroke="#a0c8f0" stroke-width="0.5" opacity="0.65"/>
  <!-- Right wing upper -->
  <path d="M60 72 Q92 45 102 22 Q85 38 65 65Z"
        fill="url(#wingR)" stroke="#a0c8f0" stroke-width="0.6" opacity="0.85"/>
  <!-- Right wing lower -->
  <path d="M60 78 Q90 80 98 98 Q80 88 62 76Z"
        fill="url(#wingR)" stroke="#a0c8f0" stroke-width="0.5" opacity="0.65"/>

  <!-- Wing shimmer veins left -->
  <path d="M60 70 Q42 52 26 28" stroke="#d0e8ff" stroke-width="0.4" opacity="0.6" fill="none"/>
  <path d="M60 74 Q44 68 30 82" stroke="#d0e8ff" stroke-width="0.3" opacity="0.5" fill="none"/>
  <!-- Wing shimmer veins right -->
  <path d="M60 70 Q78 52 94 28" stroke="#d0e8ff" stroke-width="0.4" opacity="0.6" fill="none"/>
  <path d="M60 74 Q76 68 90 82" stroke="#d0e8ff" stroke-width="0.3" opacity="0.5" fill="none"/>

  <!-- Body / dress -->
  <path d="M52 90 Q46 108 44 130 Q52 126 60 128 Q68 126 76 130 Q74 108 68 90Z"
        fill="#8060a0" opacity="0.9"/>
  <!-- Dress shimmer -->
  <path d="M55 90 Q50 112 48 130" stroke="#c090e0" stroke-width="0.6" opacity="0.45" fill="none"/>
  <path d="M65 90 Q70 112 72 130" stroke="#c090e0" stroke-width="0.6" opacity="0.45" fill="none"/>
  <!-- Sash/belt -->
  <ellipse cx="60" cy="98" rx="10" ry="2.5" fill="#c9a96e" opacity="0.8"/>

  <!-- Torso -->
  <path d="M53 78 Q52 90 60 92 Q68 90 67 78Z" fill="#7050a0" opacity="0.9"/>

  <!-- Arms -->
  <path d="M53 82 Q42 78 38 72" stroke="#fde8c8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M67 82 Q78 78 82 72" stroke="#fde8c8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Hands -->
  <circle cx="37" cy="71" r="3.5" fill="#fde8c8"/>
  <circle cx="83" cy="71" r="3.5" fill="#fde8c8"/>
  <!-- Magic sparkle from right hand -->
  <circle cx="86" cy="67" r="1.5" fill="#f0d060" opacity="0.9"/>
  <circle cx="89" cy="64" r="1" fill="#f0d060" opacity="0.7"/>
  <circle cx="83" cy="64" r="1" fill="#f0d060" opacity="0.6"/>
  <path d="M85 65 L88 62 M84 63 L81 60" stroke="#f8e880" stroke-width="0.8" opacity="0.8"/>

  <!-- Neck -->
  <rect x="57" y="68" width="6" height="8" rx="3" fill="#fde8c8"/>

  <!-- Head -->
  <ellipse cx="60" cy="60" rx="14" ry="15" fill="url(#skinGrad)"/>

  <!-- Hair — flowing, dark auburn -->
  <path d="M46 56 Q44 42 52 32 Q56 28 60 27 Q64 28 68 32 Q76 42 74 56"
        fill="#4a2010" stroke="#3a1808" stroke-width="0.5"/>
  <!-- Hair flow left -->
  <path d="M46 56 Q38 64 40 78 Q44 70 48 66" fill="#4a2010" opacity="0.85"/>
  <!-- Hair flow right -->
  <path d="M74 56 Q82 64 80 78 Q76 70 72 66" fill="#4a2010" opacity="0.85"/>
  <!-- Hair highlight -->
  <path d="M54 30 Q58 28 62 30" stroke="#9a5030" stroke-width="1.2" opacity="0.6" fill="none"/>

  <!-- Crown / tiara -->
  <path d="M50 42 L52 36 L55 40 L60 33 L65 40 L68 36 L70 42"
        stroke="#c9a96e" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <circle cx="60" cy="33" r="2" fill="#f0d080"/>
  <circle cx="52" cy="36" r="1.3" fill="#c9a96e"/>
  <circle cx="68" cy="36" r="1.3" fill="#c9a96e"/>

  <!-- Eyes -->
  <ellipse cx="55" cy="60" rx="3.5" ry="3" fill="#1a0a30"/>
  <ellipse cx="65" cy="60" rx="3.5" ry="3" fill="#1a0a30"/>
  <!-- Iris -->
  <ellipse cx="55" cy="60" rx="2.2" ry="2.2" fill="#5030a0"/>
  <ellipse cx="65" cy="60" rx="2.2" ry="2.2" fill="#5030a0"/>
  <!-- Eye shine -->
  <circle cx="56" cy="59" r="0.9" fill="white" opacity="0.9"/>
  <circle cx="66" cy="59" r="0.9" fill="white" opacity="0.9"/>
  <!-- Lashes -->
  <path d="M51.5 57.5 Q53 55.5 55 57" stroke="#1a0a30" stroke-width="0.7" fill="none"/>
  <path d="M61.5 57.5 Q63 55.5 65 57" stroke="#1a0a30" stroke-width="0.7" fill="none"/>

  <!-- Nose -->
  <path d="M59 65 Q60 67 61 65" stroke="#d0a070" stroke-width="0.8" fill="none"/>

  <!-- Mouth — slight smile -->
  <path d="M56 70 Q60 73 64 70" stroke="#c07060" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Floating sparkles -->
  <circle cx="22" cy="50" r="1.8" fill="#f0d060" opacity="0.7"/>
  <circle cx="18" cy="60" r="1.2" fill="#d0e8ff" opacity="0.6"/>
  <circle cx="100" cy="44" r="1.5" fill="#f0d060" opacity="0.65"/>
  <circle cx="104" cy="56" r="1" fill="#d0e8ff" opacity="0.55"/>
  <circle cx="30" cy="30" r="1" fill="#f8e880" opacity="0.5"/>
  <circle cx="92" cy="32" r="1" fill="#f8e880" opacity="0.5"/>
  <!-- Star sparkles -->
  <path d="M22 46 L22.5 48.5 L25 49 L22.5 49.5 L22 52 L21.5 49.5 L19 49 L21.5 48.5Z"
        fill="#f8e070" opacity="0.7"/>
  <path d="M98 40 L98.4 42 L100.4 42.4 L98.4 42.8 L98 44.8 L97.6 42.8 L95.6 42.4 L97.6 42Z"
        fill="#f8e070" opacity="0.65"/>
</svg>
